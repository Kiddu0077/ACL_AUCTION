# Netlify production deployment for Pudur Premier League.
# Uses the official Next.js App Router adapter.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Same headers we implicitly rely on: Supabase Realtime uses WebSockets which
# work by default on Netlify Edge; no extra config needed.
